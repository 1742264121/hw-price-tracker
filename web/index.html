<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬件价格追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    color: #e0e0e0;
  }
  .header {
    text-align: center;
    padding: 28px 20px 16px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .header h1 { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .header .sub { font-size: 13px; color: #8b8f9e; }
  .header .update-time { font-size: 11px; color: #666; margin-top: 6px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .category-tabs {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    justify-content: center;
  }
  .category-tabs button {
    padding: 8px 20px; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; background: rgba(255,255,255,0.06);
    color: #a0a4b0; cursor: pointer; font-size: 13px;
    transition: all 0.2s;
  }
  .category-tabs button:hover { border-color: rgba(255,255,255,0.35); color: #ddd; }
  .category-tabs button.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-color: transparent; color: #fff;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 18px;
  }
  .chart-card {
    background: rgba(255,255,255,0.04);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
    padding: 16px; overflow: hidden;
  }
  .chart-card h3 {
    font-size: 14px; font-weight: 500; color: #c8cde0;
    margin-bottom: 8px; padding-left: 4px;
  }
  .chart-card .chart { width: 100%; height: 320px; }

  .footer {
    text-align: center; padding: 30px;
    font-size: 12px; color: #555;
  }
  .footer a { color: #667eea; text-decoration: none; }

  .loading {
    text-align: center; padding: 60px;
    font-size: 16px; color: #888;
  }

  .sim-warning {
    background: linear-gradient(135deg, rgba(255,152,43,0.15), rgba(255,107,107,0.08));
    border: 1px solid rgba(255,152,43,0.3);
    border-radius: 8px; padding: 10px 18px; margin-bottom: 16px;
    font-size: 12px; color: #ffa94d;
    text-align: center;
  }
  .sim-warning .legend-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 0 4px; }
  .sim-warning .legend-dot.sim { border: 1.5px dashed #ffa94d; background: transparent; }
  .sim-warning .legend-dot.real { background: #51cf66; }

  .legend-bar {
    display: flex; justify-content: center; gap: 20px; margin-bottom: 12px;
    font-size: 11px; color: #999;
  }
  .legend-bar span { display: inline-flex; align-items: center; gap: 4px; }

  .no-data {
    text-align: center; padding: 80px 20px;
  }
  .no-data p { color: #666; font-size: 14px; }

  @media (max-width: 600px) {
    .chart-grid { grid-template-columns: 1fr; }
    .chart-card .chart { height: 260px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>硬件价格追踪</h1>
  <p class="sub">数据来源：ZOL中关村在线 · 每周二/周五自动更新</p>
  <p class="update-time" id="updateTime">加载中...</p>
</div>

<div class="container">
  <div id="simWarning" class="sim-warning" style="display:none">
    ⚠️ <b>注意：</b>虚线空心点为模拟数据（仅用于验证项目功能），实线实心点为真实采集数据。
  </div>
  <div class="legend-bar" id="legendBar" style="display:none">
    <span><b style="color:#ffa94d;font-size:14px">◇</b> 模拟数据（simulated）</span>
    <span><b style="color:#51cf66;font-size:14px">●</b> 真实采集（scraped）</span>
  </div>
  <div class="category-tabs" id="tabs"></div>
  <div class="chart-grid" id="charts"></div>
  <div class="loading" id="loading">正在加载价格数据...</div>
</div>

<div class="footer">
  <p>Powered by <a href="https://github.com" target="_blank">GitHub Actions</a> · 更新时间：北京时间 00:00</p>
</div>

<script>
(async function() {
  const CATEGORIES = ['GPU', 'CPU', 'RAM', 'SSD', 'MB'];
  const CATEGORY_NAMES = { GPU: '显卡', CPU: 'CPU', RAM: '内存', SSD: '固态硬盘', MB: '主板' };
  const CATEGORY_COLORS = { GPU: '#667eea', CPU: '#43e97b', RAM: '#f093fb', SSD: '#ff922b', MB: '#4dabf7' };

  let allData = [];
  let products = [];
  let currentCategory = 'GPU';
  let hasSimulatedData = false;
  let firstScrapedDate = null;

  // ====== 加载数据 ======
  async function loadAllData() {
    try {
      // 加载产品清单
      const pResp = await fetch('./products.json');
      products = await pResp.json();

      // 加载所有月份的数据文件
      const now = new Date();
      const months = [];
      for (let y = 2026; y >= 2025; y--) {
        for (let m = 12; m >= 1; m--) {
          const key = `${y}-${String(m).padStart(2, '0')}`;
          const year = now.getFullYear();
          const month = now.getMonth() + 1;
          if (y > year || (y === year && m > month)) continue;
          months.push(key);
        }
      }
      months.splice(36);

      for (const month of months.slice(0, 12)) {
        try {
          const resp = await fetch(`./data/${month}.json`);
          if (!resp.ok) continue;
          const json = await resp.json();
          allData.push(...json.records);
        } catch (e) {
          // 文件不存在，继续
        }
      }

      // 按日期排序
      allData.sort((a, b) => a.date.localeCompare(b.date));

      // 检测是否有模拟数据 & 找第一个真实数据日期
      for (const rec of allData) {
        if (rec.source === 'simulated') hasSimulatedData = true;
        if (rec.source === 'scraped' && !firstScrapedDate) {
          firstScrapedDate = rec.date;
        }
      }

      // 显示/隐藏模拟数据警告
      if (hasSimulatedData) {
        document.getElementById('simWarning').style.display = 'block';
        document.getElementById('legendBar').style.display = 'flex';
      }

    } catch (e) {
      console.error('加载数据失败:', e);
    }
  }

  // ====== 渲染 ======
  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = CATEGORIES.map(cat => {
      const count = products.filter(p => p.category === cat).length;
      return `<button class="${cat === currentCategory ? 'active' : ''}" 
               onclick="switchCategory('${cat}')">
              ${CATEGORY_NAMES[cat]} (${count})
            </button>`;
    }).join('');
  }

  function switchCategory(cat) {
    currentCategory = cat;
    renderTabs();
    renderCharts();
  }
  window.switchCategory = switchCategory;

  function renderCharts() {
    document.getElementById('loading').style.display = 'none';
    const chartsEl = document.getElementById('charts');

    if (allData.length === 0) {
      chartsEl.innerHTML = '<div class="no-data"><p>暂无数据，请等待首次采集完成后刷新</p></div>';
      return;
    }

    const categoryProducts = products.filter(p => p.category === currentCategory);
    
    // 收集该品类所有产品的日期-价格序列（分 track 模拟/真实来源）
    const productSeries = {};
    const allDates = new Set();

    for (const record of allData) {
      const source = record.source || 'real'; // 兼容旧数据
      for (const price of record.prices) {
        const prod = categoryProducts.find(p => p.id === price.id);
        if (!prod) continue;

        if (!productSeries[price.id]) {
          productSeries[price.id] = {
            name: price.name || prod.name,
            dates: [],
            jd_prices: [],     // 京东价（null=无数据）
            zol_prices: [],    // ZOL参考价
            sources: [],       // 'simulated' | 'scraped'
          };
        }

        productSeries[price.id].dates.push(record.date);
        productSeries[price.id].jd_prices.push(price.jd_price);
        productSeries[price.id].zol_prices.push(price.zol_price);
        productSeries[price.id].sources.push(source);
        allDates.add(record.date);
      }
    }

    const sortedDates = Array.from(allDates).sort();

    // 为每个产品生成一个图表卡片
    let html = '';
    for (const pid of Object.keys(productSeries)) {
      const series = productSeries[pid];
      if (series.dates.length < 2) continue;
      html += `<div class="chart-card">
        <h3>${series.name}</h3>
        <div class="chart" id="chart-${pid}"></div>
      </div>`;
    }

    if (!html) {
      html = '<div class="no-data"><p>该分类暂无足够数据（需要至少2次采集记录）</p></div>';
    }

    chartsEl.innerHTML = html;

    // 初始化每个图表
    for (const pid of Object.keys(productSeries)) {
      const series = productSeries[pid];
      if (series.dates.length < 2) continue;

      const chartDom = document.getElementById(`chart-${pid}`);
      if (!chartDom) continue;

      const chart = echarts.init(chartDom);
      const seriesData = [];

      // 辅助函数：拆分模拟/真实数据为独立 series
      function splitSeries(nameBase, pricesArray, color, lineStyle, symbolFilled) {
        // 模拟数据 series（虚线 + 空心）
        const simData = series.dates.map((d, i) => {
          if (series.sources[i] !== 'simulated') return null;
          const val = pricesArray[i];
          return val !== null && val !== undefined ? val : null;
        });
        const simHasData = simData.some(v => v !== null);
        if (simHasData) {
          seriesData.push({
            name: nameBase + '（模拟）',
            type: 'line', data: simData, smooth: true,
            symbol: 'emptyDiamond', symbolSize: 7,
            lineStyle: { ...lineStyle, type: 'dashed', width: 2, opacity: 0.7 },
            itemStyle: { color: color, opacity: 0.7, borderColor: color, borderWidth: 2 },
            connectNulls: false,
          });
        }

        // 真实数据 series（实线 + 实心）
        const realData = series.dates.map((d, i) => {
          if (series.sources[i] !== 'scraped') return null;
          const val = pricesArray[i];
          return val !== null && val !== undefined ? val : null;
        });
        const realHasData = realData.some(v => v !== null);
        if (realHasData) {
          seriesData.push({
            name: nameBase + '（真实）',
            type: 'line', data: realData, smooth: true,
            symbol: symbolFilled, symbolSize: 7,
            lineStyle: { ...lineStyle, width: 2.5 },
            itemStyle: { color: color },
            connectNulls: false,
          });
        }
      }
      
      // 京东价线
      const hasJd = series.jd_prices.some(p => p !== null && p !== undefined);
      if (hasJd) {
        splitSeries('京东价', series.jd_prices, '#ff6b6b',
          { color: '#ff6b6b' }, 'circle');
      }

      // ZOL参考价线
      const hasZol = series.zol_prices.some(p => p !== null && p !== undefined);
      if (hasZol) {
        splitSeries('ZOL参考价', series.zol_prices, '#4dabf7',
          { color: '#4dabf7' }, 'diamond');
      }

      // 构建 markLine（模拟→真实分界线）
      const markLines = [];
      if (firstScrapedDate && hasSimulatedData) {
        markLines.push({
          name: '真实数据开始',
          xAxis: firstScrapedDate,
          lineStyle: { color: '#51cf66', type: 'dotted', width: 1.5 },
          label: { show: true, formatter: '真实数据 ↓', position: 'start',
            color: '#51cf66', fontSize: 10, fontWeight: 'bold' },
        });
      }

      // 工具提示中标注来源
      const dataSourceMap = {};
      for (let i = 0; i < series.dates.length; i++) {
        if (!dataSourceMap[series.dates[i]]) {
          dataSourceMap[series.dates[i]] = series.sources[i];
        }
      }

      const option = {
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(20,20,40,0.92)',
          borderColor: 'rgba(255,255,255,0.1)',
          textStyle: { color: '#e0e0e0', fontSize: 12 },
          formatter: function(params) {
            let dateStr = params[0].axisValue;
            const src = dataSourceMap[dateStr];
            const srcBadge = src === 'simulated'
              ? '<span style="color:#ffa94d;font-size:10px">[模拟]</span>'
              : '<span style="color:#51cf66;font-size:10px">[真实]</span>';
            let s = `<b style="font-size:13px">${dateStr}</b> ${srcBadge}<br/>`;
            for (const p of params) {
              if (p.value !== null && p.value !== undefined) {
                s += `${p.marker} ${p.seriesName}: <b>¥${p.value}</b><br/>`;
              }
            }
            return s;
          }
        },
        legend: {
          data: seriesData.map(s => s.name),
          bottom: 0,
          textStyle: { color: '#999', fontSize: 10 },
        },
        grid: { left: '10%', right: '8%', top: 12, bottom: 44 },
        xAxis: {
          type: 'category',
          data: series.dates,
          boundaryGap: false,
          axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)' } },
          axisTick: { show: false },
          axisLabel: { color: '#888', fontSize: 10, rotate: 30 },
          splitLine: { show: false },
        },
        yAxis: {
          type: 'value',
          name: '价格 (元)',
          nameTextStyle: { color: '#888', fontSize: 10 },
          axisLabel: {
            color: '#888', fontSize: 10,
            formatter: '¥{value}',
          },
          splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } },
        },
        series: seriesData,
      };

      if (markLines.length > 0) {
        if (seriesData.length > 0) {
          option.series[0].markLine = {
            silent: true,
            symbol: 'none',
            data: markLines,
          };
        }
      }

      chart.setOption(option);

      // 响应式
      window.addEventListener('resize', () => chart.resize());
    }

    // 更新最后更新时间
    const lastRecord = allData[allData.length - 1];
    const lastDate = lastRecord ? lastRecord.date : '未知';
    const lastSource = lastRecord && lastRecord.source === 'simulated' ? ' [模拟]' : '';
    document.getElementById('updateTime').textContent = `最后更新: ${lastDate}${lastSource}`;
  }

  // ====== 启动 ======
  await loadAllData();
  renderTabs();
  renderCharts();
})();
</script>

</body>
</html>
